<div style="background: var(--surface-1); border-radius: 20px; padding: 20px; max-width: 380px; margin: 0 auto;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
    <div>
      <p style="font-size:18px; font-weight:500; margin:0;">Hello, user <span aria-hidden="true">👋</span></p>
      <p style="font-size:13px; color:var(--text-secondary); margin:2px 0 0;">Welcome to UNIDROP</p>
    </div>
    <div style="width:40px; height:40px; border-radius:50%; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;">
      <i class="ti ti-user" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i>
    </div>
  </div>

  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
      <i class="ti ti-package" style="font-size:18px; color:var(--text-accent);" aria-hidden="true"></i>
      <p style="font-size:14px; font-weight:500; margin:0;">Current delivery</p>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <p style="font-size:13px; color:var(--text-secondary); margin:0;">Delivery details</p>
      <span style="background:var(--bg-warning); color:var(--text-warning); font-size:12px; padding:3px 10px; border-radius:var(--radius);">Pending</span>
    </div>
  </div>

  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
      <i class="ti ti-lock" style="font-size:18px; color:var(--text-accent);" aria-hidden="true"></i>
      <p style="font-size:14px; font-weight:500; margin:0;">Secure delivery</p>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <p style="font-size:13px; color:var(--text-secondary); margin:0;">Generate OTP for handoff</p>
      <button style="background:var(--fill-accent); color:var(--on-accent); border:none; font-size:13px; padding:8px 14px; border-radius:var(--radius); font-weight:500;">Generate</button>
    </div>
  </div>

  <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:20px;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <i class="ti ti-truck-delivery" style="font-size:18px; color:var(--text-accent);" aria-hidden="true"></i>
        <p style="font-size:14px; font-weight:500; margin:0;">Delivery mode</p>
      </div>
      <div style="width:38px; height:22px; border-radius:12px; background:var(--fill-accent); position:relative;">
        <div style="width:18px; height:18px; border-radius:50%; background:var(--on-accent); position:absolute; top:2px; right:2px;"></div>
      </div>
    </div>
    <p style="font-size:13px; color:var(--text-secondary); margin:0;">Allow delivery access</p>
  </div>

  <p style="font-size:14px; font-weight:500; margin:0 0 12px;">Quick actions</p>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:44px; height:44px; border-radius:12px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;">
        <i class="ti ti-package" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i>
      </div>
      <span style="font-size:12px; color:var(--text-secondary);">Delivery</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:44px; height:44px; border-radius:12px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;">
        <i class="ti ti-clock" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i>
      </div>
      <span style="font-size:12px; color:var(--text-secondary);">History</span>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
      <div style="width:44px; height:44px; border-radius:12px; background:var(--bg-accent); display:flex; align-items:center; justify-content:center;">
        <i class="ti ti-bell" style="font-size:20px; color:var(--text-accent);" aria-hidden="true"></i>
      </div>
      <span style="font-size:12px; color:var(--text-secondary);">Alerts</span>
    </div>
  </div>
</div>
